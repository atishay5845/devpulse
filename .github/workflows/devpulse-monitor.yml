name: DevPulse scheduled monitoring

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devpulse-monitoring
  cancel-in-progress: false

jobs:
  run-due-monitors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run due monitor checks
        working-directory: backend
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONITOR_BATCH_SIZE: '100'
          MONITOR_FAILURE_THRESHOLD: '2'
          MONITOR_RECOVERY_THRESHOLD: '2'
        run: python manage.py run_monitor --limit 100
